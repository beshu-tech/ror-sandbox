readonlyrest:

  access_control_rules:

    - name: "KIBANA"
      type: allow
      auth_key: kibana:kibana
      verbosity: error

    - name: "Admins"
      type: allow
      auth_key: admin:admin

    - name: "Preprod"
      groups_and:
      - preprod
      - studio
      indices:
      - .kibana_preprod_analytics
      - .kibana_preprod
      kibana_access: rw
      kibana_hide_apps:
      - readonlyrest_kbn

    - actions:
      - indices:data/read/*
      filter: '{\"bool\": {\"filter\": [{\"term\": {\"manufacturer_id\": 1}}]}}'
      indices:
      - preprod_alfa
      name: preprod.96.data
      proxy_auth:
        proxy_auth_config: px1
        users:
        - preprod.96
      verbosity: info

  proxy_auth_configs:
    - name: px1
      user_id_header: x-forwarded-user
  
  users:
    - groups:
      - preprod
      - studio
      proxy_auth:
        proxy_auth_config: px1
        users:
        - preprod.96
      username: preprod.96
