readonlyrest:

  audit:
    enabled: true
    outputs: [index]

  access_control_rules:

    - name: "KIBANA"
      type: allow
      auth_key: kibana:kibana
      verbosity: error

    - name: "Test remote"
      auth_key: user1:test
      indices: ["*:asdasd", "*:*asdasd", "*:asdasd*", "*:*asdasd*"]

    - name: "Test remote (forbid)"
      type:
        policy: forbid
        response_message: "test"
      auth_key: user1:test

    - name: "Test local"
      auth_key: user2:test
      indices: ["asdasd", "*asdasd", "asdasd*", "*asdasd*"]

    - name: "Test local (forbid)"
      type:
        policy: forbid
        response_message: "test"
      auth_key: user2:test

    - name: "Admins"
      auth_key: admin:admin
      kibana:
        access: admin
