readonlyrest:

  audit:
    enabled: true
    outputs: [index]

  access_control_rules:

    - name: "KIBANA"
      type: allow
      auth_key: kibana:kibana
      verbosity: error

    - name: "Test1"
      auth_key: user:test
      indices: ["*:asdasd"]
      headers: ["test:1"]

    - name: "Test2"
      auth_key: user:test
      indices: ["*:*asdasd"]
      headers: ["test:2"]

    - name: "Test3"
      auth_key: user:test
      indices: ["*:asdasd*"]
      headers: ["test:3"]

    - name: "Test4"
      auth_key: user:test
      indices: ["*:*asdasd*"]
      headers: ["test:4"]

    - name: "Admins"
      auth_key: admin:admin
      kibana:
        access: admin
